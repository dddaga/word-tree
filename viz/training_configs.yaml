# Neurograph Training Configurations
# =================================
# 
# This file contains predefined experiment configurations for training
# Neurograph networks on various tasks.
#
# Structure:
#   experiment_name:
#     network:       # Network architecture parameters
#     training:      # Training hyperparameters
#     dataset:       # Dataset configuration
#
# Dataset types:
#   - pattern: Fixed input-output pattern mapping
#   - temporal: Sequence prediction
#   - sine: Sine wave approximation
#   - classification: Multi-class classification

# ============================================
# Basic Pattern Learning
# ============================================

xor_basic:
  description: "Basic XOR pattern learning - classic benchmark"
  network:
    num_input: 2
    num_input_connected: 4
    num_middle: 6
    num_output: 1
    vector_dim: 8
    beam_width: 10
    radiation_k: 3
    use_radiation: true
  training:
    epochs: 100
    learning_rate: 0.05
    early_stopping_patience: 15
  dataset:
    type: pattern
    patterns:
      - [0, 0]
      - [0, 1]
      - [1, 0]
      - [1, 1]
    targets: [0, 3.14159, 3.14159, 0]  # 0 and π

xor_deep:
  description: "XOR with deeper network"
  network:
    num_input: 2
    num_input_connected: 6
    num_middle: 12
    num_output: 1
    vector_dim: 16
    beam_width: 15
  training:
    epochs: 150
    learning_rate: 0.03
  dataset:
    type: pattern
    patterns:
      - [0, 0]
      - [0, 1]
      - [1, 0]
      - [1, 1]
    targets: [0, 3.14159, 3.14159, 0]

and_gate:
  description: "AND gate pattern"
  network:
    num_input: 2
    num_input_connected: 3
    num_middle: 4
    num_output: 1
    vector_dim: 8
  training:
    epochs: 50
    learning_rate: 0.1
  dataset:
    type: pattern
    patterns:
      - [0, 0]
      - [0, 1]
      - [1, 0]
      - [1, 1]
    targets: [0, 0, 0, 3.14159]

or_gate:
  description: "OR gate pattern"
  network:
    num_input: 2
    num_input_connected: 3
    num_middle: 4
    num_output: 1
    vector_dim: 8
  training:
    epochs: 50
    learning_rate: 0.1
  dataset:
    type: pattern
    patterns:
      - [0, 0]
      - [0, 1]
      - [1, 0]
      - [1, 1]
    targets: [0, 3.14159, 3.14159, 3.14159]

# ============================================
# Function Approximation
# ============================================

sine_simple:
  description: "Simple sine wave approximation"
  network:
    num_input: 1
    num_input_connected: 4
    num_middle: 8
    num_output: 1
    vector_dim: 16
  training:
    epochs: 200
    learning_rate: 0.03
    early_stopping_patience: 30
  dataset:
    type: sine

sine_high_precision:
  description: "High precision sine approximation"
  network:
    num_input: 1
    num_input_connected: 8
    num_middle: 16
    num_output: 1
    vector_dim: 32
    beam_width: 25
  training:
    epochs: 500
    learning_rate: 0.01
    early_stopping_patience: 50
  dataset:
    type: sine

# ============================================
# Temporal Sequence Processing
# ============================================

temporal_short:
  description: "Short temporal sequence prediction"
  network:
    num_input: 3
    num_input_connected: 6
    num_middle: 10
    num_output: 1
    vector_dim: 16
    beam_width: 15
  training:
    epochs: 100
    learning_rate: 0.03
  dataset:
    type: temporal
    sequence_length: 3
    prediction_horizon: 1

temporal_medium:
  description: "Medium-length sequence prediction"
  network:
    num_input: 5
    num_input_connected: 8
    num_middle: 16
    num_output: 2
    vector_dim: 16
    beam_width: 25
  training:
    epochs: 200
    learning_rate: 0.02
  dataset:
    type: temporal
    sequence_length: 5
    prediction_horizon: 2

temporal_long:
  description: "Long sequence prediction"
  network:
    num_input: 10
    num_input_connected: 15
    num_middle: 30
    num_output: 3
    vector_dim: 32
    beam_width: 40
  training:
    epochs: 300
    learning_rate: 0.01
  dataset:
    type: temporal
    sequence_length: 10
    prediction_horizon: 3

