      - [0, 1]
      - [1, 0]
      - [1, 1]
    targets: [0, 3.14159, 3.14159, 0]

# ============================================
# Energy Conservation Experiments
# ============================================

high_decay:
  description: "High temporal decay - faster energy depletion"
  network:
    num_input: 2
    num_input_connected: 4
    num_middle: 6
    num_output: 1
    vector_dim: 8
    temporal_decay: 0.6
    conductance_efficiency: 0.8
  training:
    epochs: 100
    learning_rate: 0.05
  dataset:
    type: pattern
    patterns:
      - [0, 0]
      - [0, 1]
      - [1, 0]
      - [1, 1]
    targets: [0, 3.14159, 3.14159, 0]

low_decay:
  description: "Low temporal decay - persistent activations"
  network:
    num_input: 2
    num_input_connected: 4
    num_middle: 6
    num_output: 1
    vector_dim: 8
    temporal_decay: 0.2
    conductance_efficiency: 0.95
  training:
    epochs: 100
    learning_rate: 0.05
  dataset:
    type: pattern
    patterns:
      - [0, 0]
      - [0, 1]
      - [1, 0]
      - [1, 1]
    targets: [0, 3.14159, 3.14159, 0]

# ============================================
# Beam Width Experiments
# ============================================

narrow_beam:
  description: "Narrow beam width - aggressive pruning"
  network:
    num_input: 4
    num_input_connected: 8
    num_middle: 16
    num_output: 2
    vector_dim: 16
    beam_width: 5
  training:
    epochs: 100
    learning_rate: 0.05
  dataset:
    type: classification
    num_classes: 2

wide_beam:
  description: "Wide beam width - minimal pruning"
  network:
    num_input: 4
    num_input_connected: 8
    num_middle: 16
    num_output: 2
    vector_dim: 16
    beam_width: 30
  training:
    epochs: 100
    learning_rate: 0.05
  dataset:
    type: classification
    num_classes: 2

no_beam:
  description: "No beam width - all nodes can be active"
  network:
    num_input: 4
    num_input_connected: 8
    num_middle: 16
    num_output: 2
    vector_dim: 16
    # beam_width not set = unlimited
  training:
    epochs: 100
    learning_rate: 0.05
  dataset:
    type: classification
    num_classes: 2

