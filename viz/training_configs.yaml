# Classification Tasks
# ============================================

binary_classification:
  description: "Binary classification"
  network:
    num_input: 4
    num_input_connected: 6
    num_middle: 8
    num_output: 2
    vector_dim: 8
  training:
    epochs: 100
    learning_rate: 0.05
  dataset:
