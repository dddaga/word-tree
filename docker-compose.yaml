services:
  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # CHANGED: Use a named volume instead of a local path
      - qdrant_data:/qdrant/storage
    restart: always


