services:
  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest 
    container_name: dragonfly_db
    ports:
      - "6379:6379"   