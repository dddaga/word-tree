# run13 — Routing temperature sweep: T=7.0
# Goal: Part of temperature sweep (run12=4.0, run13=7.0) to find optimal routing
#       softness for gradient distribution across intermediate nodes.
# Base: run10 (no FFN, output_nodes=10). ONE change: model.routing_temperature=7.0
# Diagnosis: gradient_starvation_analysis.py showed that 0.4% of nodes carry 50%
#            of total gradient signal — extreme concentration driven by act_strength
#            std≈4 causing winner-take-all softmax routing. Temperature=7.0 makes
#            routing nearly uniform — tests whether extreme softness helps or hurts.
# Evidence reference: vgg_training/gradient_starvation_analysis.py (2026-04-09)
# Comparison: run10 (T=1.0), run12 (T=4.0), run13 (T=7.0) — clean sweep.

# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "run13"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 15454  # unchanged from run10
  input_nodes: 3136
  output_nodes: 10    # no FFN — GNN classifies directly
  cardinality: 200
  radiation_targets: 0

# --- Model Architecture ---
model:
  vector_dim: 8
  iterations: 5
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  # DOCUMENTARY — not read by current code. This run used the legacy in-function
  # mean-subtraction in update_activations. To reproduce exactly, check out
  # git commit 7f072c4 on branch fixed_io_nodes. See:
  # vgg_training/learnings/concepts/mag_normalization.md
  subtract_mean: true
  dropout: 0.2
  routing_temperature: 7.0  # CHANGED from default 1.0 — near-uniform routing for sweep

# --- Training Hyperparameters ---
training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7
  data_fraction: 0.5  # Use 50% of training data (stratified by class)

# --- System & Logging ---
system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run13/run13_weights.pt"
  scheduler_save_path: "training_runs/run13/run13_scheduler.pt"
  tensorboard_dir: "training_runs/run13/tensorboard"
  logging:
    log_path: "training_runs/run13/run13.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
