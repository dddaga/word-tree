# run42 — D=16 + C=25 + I=5: pinpoint the cardinality cliff
#
# run40 (C=50): 83.06% — viable
# run41 (C=10): 27.97% — below floor
# run42 (C=25): pinpoints the cliff between them.
# FLOPs: 4 × 4 × 2048 × (8×25×16 + 7×25 + 24×16) = ~123M = 0.12B

qdrant:
  url: "http://localhost:6333"
  collection_name: "run42"

graph:
  total_nodes: 2048
  input_nodes: 1568
  output_nodes: 10
  cardinality: 25
  radiation_targets: 0

model:
  vector_dim: 16
  iterations: 5
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  dropout: 0.2
  routing_temperature: 4.0
  beam_width: 0

training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7

system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run42/run42_weights.pt"
  scheduler_save_path: "training_runs/run42/run42_scheduler.pt"
  tensorboard_dir: "training_runs/run42/tensorboard"
  logging:
    log_path: "training_runs/run42/run42.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
