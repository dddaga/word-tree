# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "run9"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 15454 #123633664/ (1000 * vector_dim)
  input_nodes: 3136 # 512*7*7 / vector_dim
  output_nodes: 256
  cardinality: 200
  radiation_targets: 0
  topology: "layered"

# --- Model Architecture ---
model:
  vector_dim: 8
  iterations: 7
  # radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  dtype: "float32"
  # scattering_prob: 0.25 #not needed when radiation_targets=0
  # stochastic_radiation_duration: 0.08
  layernorm: true
  # DOCUMENTARY — not read by current code. This run used the legacy in-function
  # mean-subtraction in update_activations. To reproduce exactly, check out
  # git commit 7f072c4 on branch fixed_io_nodes. See:
  # vgg_training/learnings/concepts/mag_normalization.md
  subtract_mean: true
  dropout: 0.2
  beam_width: 0

# --- Training Hyperparameters ---
training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7


# --- System & Logging ---
system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run9/run9_weights.pt"
  scheduler_save_path: "training_runs/run9/run9_scheduler.pt"
  tensorboard_dir: "training_runs/run9/tensorboard"
  logging:
    log_path: "training_runs/run9/run9.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
