# run16 — Combine run11 (N=4146) + run12 (T=4.0), full data
# Goal: Test whether the two confirmed improvements compound.
#   run11: N=4146 → 61.32% (HYPOTHESIS: fewer params, denser connectivity)
#   run12: T=4.0  → 82.19% (CONFIRMED: key lever)
#   This run combines both. Full data (100%) because fewer nodes = faster epochs
#   and 66K params can benefit from more samples (less overfitting risk).
# Base: run12. TWO changes: total_nodes=4146, data_fraction=1.0 (removed).
# Comparison: run12 (T=4.0, N=15454, 50% data, 82.19%), run11 (T=1.0, N=4146, 100% data, 61.32%)

# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "run16"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 4146   # CHANGED from run12 (15454) — same as run11 (3136+1000+10)
  input_nodes: 3136
  output_nodes: 10    # no FFN — GNN classifies directly
  cardinality: 200
  radiation_targets: 0

# --- Model Architecture ---
model:
  vector_dim: 8
  iterations: 5
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  dropout: 0.2
  routing_temperature: 4.0  # same as run12 — CONFIRMED key lever

# --- Training Hyperparameters ---
training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7
  # data_fraction omitted → uses 100% of training data

# --- System & Logging ---
system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run16/run16_weights.pt"
  scheduler_save_path: "training_runs/run16/run16_scheduler.pt"
  tensorboard_dir: "training_runs/run16/tensorboard"
  logging:
    log_path: "training_runs/run16/run16.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
