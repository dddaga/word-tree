# run40 — D=16 + C=50 + I=5: test if more iterations rescue low cardinality
#
# run39 (D=16, C=50, I=3): 75.49% — surprisingly below run31 (D=8, C=50, I=5 → 79.54%).
# Hypothesis: low C needs high I. run40 tests D=16 + C=50 + I=5.
# FLOPs: (5-1) × 4 × 2048 × (8×50×16 + 7×50 + 24×16) = 234M = 0.23B
#
# If >85% → I is the key at low C. If ~80% → D=16 + low C is just structurally limited.

qdrant:
  url: "http://localhost:6333"
  collection_name: "run40"

graph:
  total_nodes: 2048
  input_nodes: 1568
  output_nodes: 10
  cardinality: 50
  radiation_targets: 0

model:
  vector_dim: 16
  iterations: 5           # CHANGED from 3 — full iterations at low C
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  dropout: 0.2
  routing_temperature: 4.0
  beam_width: 0

training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7

system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run40/run40_weights.pt"
  scheduler_save_path: "training_runs/run40/run40_scheduler.pt"
  tensorboard_dir: "training_runs/run40/tensorboard"
  logging:
    log_path: "training_runs/run40/run40.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
