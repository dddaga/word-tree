# run20 — FLOPs reduction cycle 1, step 2: cardinality=50
# Goal: 4x FLOPs reduction at best-known config.
#
# Hypothesis: Continues run19's sweep — if C=100 holds accuracy, C=50 probes further.
#   At N=4146, C=50 still gives ~1.2% density. The 8*C*V term drops 4x vs run17.
#
# Sweep: run19 (C=100), run20 (C=50), run21 (C=25). All else identical to run17.
# Baseline: run17 (C=200, 86.85% @ep38, 0.96B FLOPs/fwd)
# Target: ≥83% val with ≤0.24B FLOPs/fwd (4x reduction)

# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "run20"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 4146
  input_nodes: 3136
  output_nodes: 10
  cardinality: 50     # CHANGED from run17 (200) — 4x FLOPs reduction
  radiation_targets: 0

# --- Model Architecture ---
model:
  vector_dim: 8
  iterations: 5
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  dropout: 0.2
  routing_temperature: 4.0

# --- Training Hyperparameters ---
training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7

# --- System & Logging ---
system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run20/run20_weights.pt"
  scheduler_save_path: "training_runs/run20/run20_scheduler.pt"
  tensorboard_dir: "training_runs/run20/tensorboard"
  logging:
    log_path: "training_runs/run20/run20.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
