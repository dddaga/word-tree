# run38 — D=16 + C=100: aggressive FLOPs reduction
#
# run36 (D=16, C=200, I=3): 89.55% @ 0.45B
# run38 (D=16, C=100, I=3): ??? @ ~0.23B FLOPs (halve from run36)
#
# At D=8, C=100 gave 85.89% (run32). With D=16's expressivity, could be higher.
# If val >87%, new Pareto-optimal at 0.23B budget.

qdrant:
  url: "http://localhost:6333"
  collection_name: "run38"

graph:
  total_nodes: 2048
  input_nodes: 1568
  output_nodes: 10
  cardinality: 100         # CHANGED from 200
  radiation_targets: 0

model:
  vector_dim: 16
  iterations: 3
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  dropout: 0.2
  routing_temperature: 4.0
  beam_width: 0

training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7

system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run38/run38_weights.pt"
  scheduler_save_path: "training_runs/run38/run38_scheduler.pt"
  tensorboard_dir: "training_runs/run38/tensorboard"
  logging:
    log_path: "training_runs/run38/run38.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
