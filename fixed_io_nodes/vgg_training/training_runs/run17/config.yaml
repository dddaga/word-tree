# run17 — Re-run of run16 under new post-update LayerNorm (commit f11f768)
# Goal: Measure effect of LN placement fix on the best known config (run16: 86.55%).
#
# LN change (run 17+): LayerNorm moved from pre-update (applied to source mag before
#   aggregation, γ/β had no effect on stored state) to post-update (applied to new_mag
#   immediately after update_activations, γ/β now genuinely learnable from stored state).
#   Hardcoded in-function mean-subtraction also removed from update_activations.
#   act_strength scale changed: Σ(r/exp(μ)) → Σ exp(LN(mag))·cos(phase).
#   Full details: vgg_training/learnings/concepts/mag_normalization.md
#
# Config identical to run16. TWO experiments in this LN-fix series:
#   run17: N=4146, T=4.0 (this run) — primary validation at best config
#   run18: N=4146, T=1.0          — check if T=1.0 starvation changes under new LN
#
# Comparison target: run16 (N=4146, T=4.0, 100% data, old LN → 86.55% @ep40)

# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "run17"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 4146   # same as run16 (3136 input + 1000 intermediate + 10 output)
  input_nodes: 3136
  output_nodes: 10    # no FFN — GNN classifies directly
  cardinality: 200
  radiation_targets: 0

# --- Model Architecture ---
model:
  vector_dim: 8
  iterations: 5
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  dropout: 0.2
  routing_temperature: 4.0  # same as run16

# --- Training Hyperparameters ---
training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7
  # data_fraction omitted → uses 100% of training data

# --- System & Logging ---
system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run17/run17_weights.pt"
  scheduler_save_path: "training_runs/run17/run17_scheduler.pt"
  tensorboard_dir: "training_runs/run17/tensorboard"
  logging:
    log_path: "training_runs/run17/run17.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
