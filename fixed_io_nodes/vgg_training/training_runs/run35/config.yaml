# run35 — Uniform routing at C=200, I=4: fill iteration curve
#
# Iteration curve so far:
#   I=2 (run34): 72.05% @ 0.24B FLOPs — too few, fails
#   I=3 (run33): 87.16% @ 0.48B FLOPs — beats run17 at half FLOPs
#   I=5 (run29): 89.15% @ 0.96B FLOPs — best overall
# run35 tests I=4 @ 0.72B FLOPs to see if the curve is smooth.
#
# Expected: ~88% (between run33 and run29). If ~89%+, another Pareto point.

qdrant:
  url: "http://localhost:6333"
  collection_name: "run35"

graph:
  total_nodes: 4146
  input_nodes: 3136
  output_nodes: 10
  cardinality: 200
  radiation_targets: 0

model:
  vector_dim: 8
  iterations: 4            # CHANGED — mid-point between run33 (I=3) and run29 (I=5)
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  dropout: 0.2
  routing_temperature: 4.0
  beam_width: 0

training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7

system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run35/run35_weights.pt"
  scheduler_save_path: "training_runs/run35/run35_scheduler.pt"
  tensorboard_dir: "training_runs/run35/tensorboard"
  logging:
    log_path: "training_runs/run35/run35.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
