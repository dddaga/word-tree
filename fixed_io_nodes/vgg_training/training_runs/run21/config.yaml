# run21 — FLOPs reduction cycle 1, step 3: cardinality=25
# Goal: 8x FLOPs reduction — probe the accuracy cliff.
#
# Hypothesis: At C=25 (~0.6% density), connectivity may be too sparse for the
#   message-passing aggregation to propagate class signals in 5 iterations.
#   Purpose of this run is to IDENTIFY THE ELBOW — not to succeed at 95%.
#
# Sweep: run19 (C=100), run20 (C=50), run21 (C=25). All else identical to run17.
# Baseline: run17 (C=200, 86.85% @ep38, 0.96B FLOPs/fwd)
# Expected: Accuracy likely drops (possibly below 80%). Identifies cliff location.

# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "run21"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 4146
  input_nodes: 3136
  output_nodes: 10
  cardinality: 25     # CHANGED from run17 (200) — 8x FLOPs reduction (cliff probe)
  radiation_targets: 0

# --- Model Architecture ---
model:
  vector_dim: 8
  iterations: 5
  radiation_similarity_threshold: 0.5
  temporal_decay: 1.0
  activation_threshold: 0.1
  dtype: "float32"
  scattering_prob: 0.25
  stochastic_radiation_duration: 0.08
  layernorm: true
  dropout: 0.2
  routing_temperature: 4.0

# --- Training Hyperparameters ---
training:
  lr: 0.0001
  batch_size: 4
  accumulation_steps: 4
  epochs: 40
  validation_fraction: 0.0
  lr_decay_factor: 0.5
  plateau_patience: 5
  min_lr: 1e-7

# --- System & Logging ---
system:
  device: "mps"
  random_seed: 42
  weights_save_path: "training_runs/run21/run21_weights.pt"
  scheduler_save_path: "training_runs/run21/run21_scheduler.pt"
  tensorboard_dir: "training_runs/run21/tensorboard"
  logging:
    log_path: "training_runs/run21/run21.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    verbose: false
