# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "distributed_test"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 150
  input_nodes: 8
  output_nodes: 10
  cardinality: 5
  radiation_targets: 5

# --- Model Architecture ---
model:
  vector_dim: 8
  phase_bins: null
  mag_bins: null
  gamma: 1.5
  iterations: 5
  radiation_similarity_threshold: 0.1
  temporal_decay: 0.9
  activation_threshold: 0.1
  dtype: "float32"
  phase_damping: 1.0
  accumulate_dyn_loss: false
  dyn_loss_weight: 0.0
  scattering_prob: 0.8
  stochastic_radiation_duration: 0.4

# --- Training Hyperparameters ---
training: 
  lr: 0.001
  accumulation_steps: 4
  epochs: 16
  validation_fraction: 0.2


# --- System & Logging ---
system:
  device: "cuda"
  random_seed: 42
  weights_save_path: "training_runs/distributed_test/distributed_test_weights.pt"
  logging:
    log_path: "training_runs/distributed_test/distributed_test.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
    tensorboard_dir: null
    verbose: false
