# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "continuous_fp16_v5"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 500
  input_nodes: 196
  output_nodes: 10
  cardinality: 5
  radiation_targets: 2

# --- Model Architecture ---
model:
  vector_dim: 4
  phase_bins: 256
  mag_bins: 256
  gamma: 4.0
  iterations: 4
  activation_threshold: 0.01
  temporal_decay: 0.9  # Decay factor for activation strength (older signals become weaker)

# --- Training Hyperparameters ---
training:
  lr: 0.01
  batch_size: 16   # Number of gradient samples to accumulate before updating weights
  worker_count: 5 # Base worker count (optimized automatically based on device)
  auto_workers: true  # Automatically adjust workers: 5+ for GPU, 2 for CPU
  timeout: 300 #time to wait for data from queue


# --- System & Logging ---
system:
  device: "cpu"  # Options: "auto" (detect best), "cuda", "mps", "cpu"
                 # Note: MPS/CUDA have multiprocessing issues with current architecture
                 # Use CPU for stable training, GPU support needs architecture refactor
  logging:
    log_path: "training_logs/log0.csv"
    tensorboard_dir: "training_logs/tensorboard"
    save_interval_seconds: 10