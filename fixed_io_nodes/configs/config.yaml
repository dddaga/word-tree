# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "final6"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 100
  input_nodes: 14
  output_nodes: 10
  cardinality: 5
  radiation_targets: 5

# --- Model Architecture ---
model:
  vector_dim: 56
  phase_bins: 256
  mag_bins: 256
  gamma: 0.9
  iterations: 5
  activation_threshold: 0.05

# --- Training Hyperparameters ---
training:
  lr: 0.01
  worker_count: 5  # Base worker count (optimized automatically based on device)
  auto_workers: true  # Automatically adjust workers: 5+ for GPU, 2 for CPU
  timeout: 300 #time to wait for data from queue


# --- System & Logging ---
system:
  device: "auto"  # Options: "auto" (detect best), "cuda", "mps", "cpu"
  logging:
    log_path: "training_logs/log0.csv"
    save_interval_seconds: 10