# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "final16"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 100
  input_nodes: 28
  output_nodes: 10
  cardinality: 3
  radiation_targets: 2

# --- Model Architecture ---
model:
  vector_dim: 28
  phase_bins: 16
  mag_bins: 16
  gamma: 4.0
  iterations: 3
  activation_threshold: 0.1
  temporal_decay: 0.5  # Decay factor for activation strength (older signals become weaker)

# --- Training Hyperparameters ---
training:
  lr: 0.01
  worker_count: 13 # Base worker count (optimized automatically based on device)
  auto_workers: true  # Automatically adjust workers: 5+ for GPU, 2 for CPU
  timeout: 300 #time to wait for data from queue


# --- System & Logging ---
system:
  device: "cpu"  # Options: "auto" (detect best), "cuda", "mps", "cpu"
                 # Note: MPS/CUDA have multiprocessing issues with current architecture
                 # Use CPU for stable training, GPU support needs architecture refactor
  logging:
    log_path: "training_logs/log0.csv"
    tensorboard_dir: "training_logs/tensorboard"
    save_interval_seconds: 10