# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "main3"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 400
  input_nodes: 4
  output_nodes: 3
  cardinality: 4
  radiation_targets: 5

# --- Model Architecture ---
model:
  vector_dim: 1
  phase_bins: null
  mag_bins: null
  gamma: 1.5
  iterations: 3
  radiation_similarity_threshold: 0.1
  temporal_decay: 0.9
  activation_threshold: 0.1

# --- Training Hyperparameters ---
training:
  lr: 0.001
  accumulation_steps: 4
  momentum: 0.9
  worker_count: 4
  timeout: 300 #time to wait for data from queue
  epochs: 100


# --- System & Logging ---
system:
  device: "cuda"
  random_seed: 42
  logging:
    log_path: "training_logs/main3.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class', 'skipped']
