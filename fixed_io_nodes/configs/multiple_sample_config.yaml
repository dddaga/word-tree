#For dataset with multiple sample of a single class, and none for other classes

# --- Qdrant & Database Configuration ---
qdrant:
  url: "http://localhost:6333"
  collection_name: "multiple_sample3"


# --- Graph Structure & Node Initialization ---
graph:
  total_nodes: 200
  input_nodes: 14
  output_nodes: 10
  cardinality: 5
  radiation_targets: 5

# --- Model Architecture ---
model:
  vector_dim: 14
  phase_bins: 256
  mag_bins: 256
  gamma: 1.0
  iterations: 3
  activation_threshold: 0.05

# --- Training Hyperparameters ---
training:
  lr: 0.001
  worker_count: 1
  timeout: 300 #time to wait for data from queue


# --- System & Logging ---
system:
  device: "cuda"
  random_seed: 42
  logging:
    log_path: "training_logs/multiple_sample_log3.csv"
    save_interval_seconds: 10
    fieldnames: ['worker_id', 'loss', 'class']